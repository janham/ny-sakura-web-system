---
# Web server specific variables
server_type: web

# NFS directory ownership
nfs_apps_owner: nginx
nfs_apps_group: nginx

# Nginx
nginx_user: nginx

# Application sites
app_sites:
  - supplier2
  - portal2
  - portal2-new

# Geo blocking exclusions
# Sites in this list will NOT have geo blocking applied (allow all countries)
# Note: portal2-new uses path-specific exclusion for /api/smaregi/webhooks/
nginx_geo_exclude_sites: []
