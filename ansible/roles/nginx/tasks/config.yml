---
# nginx.conf 設定
- name: Check if nginx.conf exists
  stat:
    path: /etc/nginx/nginx.conf
  register: nginx_conf_stat
  become: true

- name: Backup original nginx.conf
  copy:
    src: /etc/nginx/nginx.conf
    dest: /etc/nginx/nginx.conf.backup
    remote_src: true
    force: false
  become: true
  when: nginx_conf_stat.stat.exists

- name: Configure nginx.conf
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    validate: 'nginx -t -c %s'
  become: true
  notify: restart nginx

- name: Ensure conf.d directory exists
  file:
    path: /etc/nginx/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
