---
# NFS マウント設定
- name: Install NFS utilities using offline_package_install role
  include_role:
    name: offline_package_install
  vars:
    offline_mode: "{{ server_type == 'batch' }}"
    offline_proxy_server: gs-web
    offline_package_name: nfs-utils
    offline_temp_dir: /tmp/nfs-packages
    package_names:
      - nfs-utils

- name: Create NFS mount point directory
  file:
    path: "{{ nfs_mount_point }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Mount NFS share
  ansible.posix.mount:
    path: "{{ nfs_mount_point }}"
    src: "{{ nfs_server_ip }}:{{ nfs_export_path }}"
    fstype: nfs
    opts: defaults,_netdev
    state: mounted
  become: true

- name: Verify NFS mount
  command: df -h {{ nfs_mount_point }}
  register: nfs_mount_verify
  changed_when: false

- name: Display NFS mount status
  debug:
    msg: "{{ nfs_mount_verify.stdout_lines }}"

- name: Create application directory on NFS
  file:
    path: "{{ nfs_mount_point }}/apps"
    state: directory
    owner: "{{ nfs_apps_owner }}"
    group: "{{ nfs_apps_group }}"
    mode: '0775'
  become: true

- name: Test NFS write permission in apps directory
  file:
    path: "{{ nfs_mount_point }}/apps/test_ansible_write"
    state: touch
    owner: "{{ nfs_apps_owner }}"
    group: "{{ nfs_apps_group }}"
    mode: '0644'
  become: true
  register: nfs_write_test
  ignore_errors: true

- name: Remove test file
  file:
    path: "{{ nfs_mount_point }}/apps/test_ansible_write"
    state: absent
  become: true
  when: nfs_write_test is succeeded

- name: Display NFS write test result
  debug:
    msg: "NFS write test: {{ 'SUCCESS' if nfs_write_test is succeeded else 'FAILED' }}"
