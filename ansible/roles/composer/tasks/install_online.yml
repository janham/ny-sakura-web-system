---
# Composer installation - Online mode (for Web server)

- name: Download Composer installer
  get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-setup.php
    mode: '0755'
  become: true

- name: Install Composer globally
  command: php /tmp/composer-setup.php --install-dir={{ composer_install_dir }} --filename={{ composer_binary_name }}
  args:
    creates: "{{ composer_install_dir }}/{{ composer_binary_name }}"
  become: true

- name: Remove Composer installer
  file:
    path: /tmp/composer-setup.php
    state: absent
  become: true
