---
# Composer installation - Offline mode (for Batch server)

- name: Download Composer installer on proxy server
  get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-setup.php
    mode: '0755'
  delegate_to: gs-web
  run_once: true
  become: true

- name: Install Composer on proxy server
  command: php /tmp/composer-setup.php --install-dir=/tmp --filename=composer
  args:
    creates: /tmp/composer
  delegate_to: gs-web
  run_once: true
  become: true

- name: Fetch Composer from proxy server
  fetch:
    src: /tmp/composer
    dest: /tmp/composer-batch
    flat: yes
  delegate_to: gs-web
  run_once: true
  become: true

- name: Upload Composer to batch server
  copy:
    src: /tmp/composer-batch
    dest: "{{ composer_install_dir }}/{{ composer_binary_name }}"
    mode: '0755'
    owner: root
    group: root
  become: true

- name: Clean up Composer from proxy server
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/composer-setup.php
    - /tmp/composer
  delegate_to: gs-web
  run_once: true
  become: true

- name: Clean up local Composer file
  file:
    path: /tmp/composer-batch
    state: absent
  delegate_to: localhost
  run_once: true
  become: false
