---
# MariaDB クライアントインストール
- name: Install MariaDB client using offline_package_install role
  include_role:
    name: offline_package_install
  vars:
    offline_mode: "{{ server_type == 'batch' }}"
    offline_proxy_server: gs-web
    offline_package_name: mariadb-client
    offline_temp_dir: /tmp/mariadb-packages
    package_names:
      - mariadb
      - mariadb-common
      - mariadb-connector-c
      - perl-Sys-Hostname
      - python3-PyMySQL

- name: Verify MariaDB client installation
  command: mysql --version
  register: mysql_version
  changed_when: false

- name: Display MariaDB client version
  debug:
    msg: "{{ mysql_version.stdout }}"

- name: Test MariaDB connection
  command: mysql -h {{ mariadb_host }} -P {{ mariadb_port }} -u faw43478 -p'{{ vault_db_default_password }}' -e "SELECT 1"
  register: mysql_connection_test
  changed_when: false
  failed_when: false
  no_log: true

- name: Display MariaDB connection status
  debug:
    msg: "MariaDB connection: {{ 'SUCCESS' if mysql_connection_test.rc == 0 else 'FAILED' }}"
