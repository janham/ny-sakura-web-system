---
# PHP 8.1 拡張モジュールインストール
- name: Install required PHP extensions using offline_package_install role
  include_role:
    name: offline_package_install
  vars:
    offline_mode: "{{ server_type == 'batch' }}"
    offline_proxy_server: gs-web
    offline_package_name: php81-extensions
    offline_temp_dir: /tmp/php81-extensions-packages
    package_names:
      - php-pdo
      - php-mysqlnd
      - php-mbstring
      - php-gd
      - php-xml
      - php-opcache
      - php-pecl-zip
      - php-bcmath
      - php-json
      - php-intl
      - php-soap
      - php-process
      - php-pecl-apcu

- name: Verify installed PHP modules
  command: php -m
  register: php_modules
  changed_when: false

- name: Display installed PHP modules (essential ones)
  debug:
    msg: "Essential modules installed: pdo_mysql={{ 'pdo_mysql' in php_modules.stdout }}, mbstring={{ 'mbstring' in php_modules.stdout }}, gd={{ 'gd' in php_modules.stdout }}, opcache={{ 'Zend OPcache' in php_modules.stdout }}"
