---
# php.ini 設定
- name: Locate php.ini file
  command: php -i | grep "Loaded Configuration File"
  register: php_ini_location
  changed_when: false

- name: Display php.ini location
  debug:
    msg: "{{ php_ini_location.stdout }}"

- name: Backup original php.ini
  copy:
    src: /etc/php.ini
    dest: /etc/php.ini.backup
    remote_src: true
    force: false
  become: true

- name: Configure memory_limit
  lineinfile:
    path: /etc/php.ini
    regexp: '^memory_limit\s*='
    line: 'memory_limit = 256M'
    backup: false
  become: true
  notify: restart php-fpm

- name: Configure upload_max_filesize
  lineinfile:
    path: /etc/php.ini
    regexp: '^upload_max_filesize\s*='
    line: 'upload_max_filesize = 20M'
    backup: false
  become: true
  notify: restart php-fpm

- name: Configure post_max_size
  lineinfile:
    path: /etc/php.ini
    regexp: '^post_max_size\s*='
    line: 'post_max_size = 20M'
    backup: false
  become: true
  notify: restart php-fpm

- name: Configure max_execution_time
  lineinfile:
    path: /etc/php.ini
    regexp: '^max_execution_time\s*='
    line: 'max_execution_time = 0'
    backup: false
  become: true
  notify: restart php-fpm

- name: Configure date.timezone
  lineinfile:
    path: /etc/php.ini
    regexp: '^;?date.timezone\s*='
    line: 'date.timezone = "Asia/Tokyo"'
    backup: false
  become: true
  notify: restart php-fpm

- name: Verify PHP configuration
  shell: |
    php -r "echo 'memory_limit: ' . ini_get('memory_limit') . PHP_EOL;"
    php -r "echo 'upload_max_filesize: ' . ini_get('upload_max_filesize') . PHP_EOL;"
    php -r "echo 'post_max_size: ' . ini_get('post_max_size') . PHP_EOL;"
    php -r "echo 'max_execution_time: ' . ini_get('max_execution_time') . PHP_EOL;"
  register: php_config_verify
  changed_when: false

- name: Display PHP configuration
  debug:
    msg: "{{ php_config_verify.stdout_lines }}"
