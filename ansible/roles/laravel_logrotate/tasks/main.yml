---
# Laravel Logrotate setup

- name: Create logrotate config for Laravel application logs
  template:
    src: laravel-app-logs.j2
    dest: /etc/logrotate.d/laravel-app
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Create logrotate config for Laravel scheduler log
  template:
    src: laravel-scheduler-log.j2
    dest: /etc/logrotate.d/laravel-scheduler
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Verify logrotate configuration
  command: logrotate -d /etc/logrotate.d/laravel-app
  register: logrotate_test
  changed_when: false
  failed_when: false
  become: true

- name: Display logrotate test result
  debug:
    msg: "Logrotate configuration is {{ 'valid' if logrotate_test.rc == 0 else 'invalid' }}"
