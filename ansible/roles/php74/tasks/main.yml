---
# PHP 7.4 role - Main tasks
- name: Display starting php74 role
  debug:
    msg: "Starting PHP 7.4 (Remi) role - Installation and configuration"

- name: Add Remi repository
  include_tasks: repo.yml
  tags:
    - php74
    - repo

- name: Install PHP 7.4
  include_tasks: install.yml
  tags:
    - php74
    - install

- name: Install PHP 7.4 extensions
  include_tasks: modules.yml
  tags:
    - php74
    - modules

- name: Configure PHP 7.4 php.ini
  include_tasks: config.yml
  tags:
    - php74
    - config

- name: Configure PHP 7.4 PHP-FPM
  include_tasks: fpm.yml
  tags:
    - php74
    - fpm

- name: Display php74 role completion
  debug:
    msg: "PHP 7.4 (Remi) role completed - PHP 7.4 is ready for portal2"
