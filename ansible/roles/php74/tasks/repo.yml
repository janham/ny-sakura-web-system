---
# Remi リポジトリ追加
- name: Install EPEL and Remi repositories using offline_package_install role
  include_role:
    name: offline_package_install
  vars:
    offline_mode: "{{ server_type == 'batch' }}"
    offline_proxy_server: gs-web
    offline_package_name: php74-repos
    offline_temp_dir: /tmp/php74-repos-packages
    package_names:
      - epel-release
      - https://rpms.remirepo.net/enterprise/remi-release-9.rpm

- name: Verify Remi repository installation
  command: dnf repolist | grep remi
  register: remi_repo
  changed_when: false
  failed_when: false

- name: Display Remi repository status
  debug:
    msg: "Remi repository is {{ 'installed' if 'remi' in remi_repo.stdout else 'not found' }}"
