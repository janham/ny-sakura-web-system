---
# Remi リポジトリ追加
- name: Install EPEL repository
  dnf:
    name: epel-release
    state: present
  become: true

- name: Install Remi repository
  dnf:
    name: https://rpms.remirepo.net/enterprise/remi-release-9.rpm
    state: present
    disable_gpg_check: true
  become: true

- name: Verify Remi repository installation
  command: dnf repolist | grep remi
  register: remi_repo
  changed_when: false
  failed_when: false

- name: Display Remi repository status
  debug:
    msg: "Remi repository is {{ 'installed' if 'remi' in remi_repo.stdout else 'not found' }}"
