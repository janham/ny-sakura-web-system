---
# PHP 7.4 php.ini 設定
- name: Backup original PHP 7.4 php.ini
  copy:
    src: /etc/opt/remi/php74/php.ini
    dest: /etc/opt/remi/php74/php.ini.backup
    remote_src: true
    force: false
  become: true

- name: Configure PHP 7.4 memory_limit
  lineinfile:
    path: /etc/opt/remi/php74/php.ini
    regexp: '^memory_limit\s*='
    line: 'memory_limit = 256M'
    backup: false
  become: true
  notify: restart php74-php-fpm

- name: Configure PHP 7.4 upload_max_filesize
  lineinfile:
    path: /etc/opt/remi/php74/php.ini
    regexp: '^upload_max_filesize\s*='
    line: 'upload_max_filesize = 20M'
    backup: false
  become: true
  notify: restart php74-php-fpm

- name: Configure PHP 7.4 post_max_size
  lineinfile:
    path: /etc/opt/remi/php74/php.ini
    regexp: '^post_max_size\s*='
    line: 'post_max_size = 20M'
    backup: false
  become: true
  notify: restart php74-php-fpm

- name: Configure PHP 7.4 max_execution_time
  lineinfile:
    path: /etc/opt/remi/php74/php.ini
    regexp: '^max_execution_time\s*='
    line: 'max_execution_time = 0'
    backup: false
  become: true
  notify: restart php74-php-fpm

- name: Configure PHP 7.4 date.timezone
  lineinfile:
    path: /etc/opt/remi/php74/php.ini
    regexp: '^;?date.timezone\s*='
    line: 'date.timezone = "Asia/Tokyo"'
    backup: false
  become: true
  notify: restart php74-php-fpm

- name: Verify PHP 7.4 configuration
  shell: |
    /opt/remi/php74/root/usr/bin/php -r "echo 'memory_limit: ' . ini_get('memory_limit') . PHP_EOL;"
    /opt/remi/php74/root/usr/bin/php -r "echo 'upload_max_filesize: ' . ini_get('upload_max_filesize') . PHP_EOL;"
    /opt/remi/php74/root/usr/bin/php -r "echo 'post_max_size: ' . ini_get('post_max_size') . PHP_EOL;"
    /opt/remi/php74/root/usr/bin/php -r "echo 'max_execution_time: ' . ini_get('max_execution_time') . PHP_EOL;"
  register: php74_config_verify
  changed_when: false

- name: Display PHP 7.4 configuration
  debug:
    msg: "{{ php74_config_verify.stdout_lines }}"
