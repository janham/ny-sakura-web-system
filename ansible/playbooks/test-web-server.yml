          ### TEST-02-06: HTTPアクセステスト (portal2)
          - **結果**: {{ 'PASS' if test_02_06.stdout == '200' else 'FAIL' }}
          - **HTTPステータス**: {{ test_02_06.stdout }}

          ### TEST-02-07: HTTPアクセステスト (portal2-new)
          - **結果**: {{ 'PASS' if test_02_07.stdout == '200' else 'FAIL' }}
          - **HTTPステータス**: {{ test_02_07.stdout }}

          ---

          ## Phase 3: PHP 8.1 テスト

          ### TEST-03-01: PHP 8.1インストール確認
          - **結果**: {{ 'PASS' if 'PHP 8.1' in test_03_01.stdout else 'FAIL' }}
          - **出力**: {{ test_03_01.stdout_lines[0] }}

          ### TEST-03-02: PHP-FPMサービス状態確認
          - **結果**: {{ 'PASS' if test_03_02.rc == 0 else 'FAIL' }}
          - **出力**: {{ test_03_02.stdout }}

          ### TEST-03-03: PHP-FPMソケット確認
          - **結果**: {{ 'PASS' if test_03_03.stat.exists else 'FAIL' }}
          - **存在**: {{ test_03_03.stat.exists }}

          ### TEST-03-04: PHP-FPMソケット権限確認
          - **結果**: {{ 'PASS' if test_03_04.stdout == 'nginx:nginx' else 'FAIL' }}
          - **所有者**: {{ test_03_04.stdout }}

          ### TEST-03-05: PHP動作確認 (supplier2)
          - **結果**: {{ 'PASS' if 'PHP Version 8.1' in test_03_05.stdout else 'FAIL' }}
          - **出力**: {{ test_03_05.stdout }}

          ### TEST-03-06: PHP動作確認 (portal2-new)
          - **結果**: {{ 'PASS' if 'PHP Version 8.1' in test_03_06.stdout else 'FAIL' }}
          - **出力**: {{ test_03_06.stdout }}

          ---

          ## Phase 4: PHP 7.4 テスト

          ### TEST-04-01: PHP 7.4インストール確認
          - **結果**: {{ 'PASS' if 'PHP 7.4' in test_04_01.stdout else 'FAIL' }}
          - **出力**: {{ test_04_01.stdout_lines[0] }}

          ### TEST-04-02: PHP 7.4 FPMサービス状態確認
          - **結果**: {{ 'PASS' if test_04_02.rc == 0 else 'FAIL' }}
          - **出力**: {{ test_04_02.stdout }}

          ### TEST-04-03: PHP 7.4 FPMソケット確認
          - **結果**: {{ 'PASS' if test_04_03.stat.exists else 'FAIL' }}
