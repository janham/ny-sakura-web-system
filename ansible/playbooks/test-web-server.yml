          ### TEST-01-05: Firewalld状態確認
          - **結果**: {{ 'PASS' if test_01_05.stdout == 'inactive' else 'FAIL' }}
          - **出力**: {{ test_01_05.stdout }}

          ### TEST-01-06: SSH設定確認
          - **結果**: {{ 'PASS' if 'Port 26622' in test_01_06.stdout else 'FAIL' }}
          - **出力**: {{ test_01_06.stdout }}

          ---

          ## Phase 2: Nginx テスト

