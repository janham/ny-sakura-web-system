          ---

          ## Phase 6: MariaDB Client + NFS テスト

          ### TEST-06-01: MariaDBクライアントインストール確認
          - **結果**: {{ 'PASS' if 'MariaDB' in test_06_01.stdout else 'FAIL' }}
          - **出力**: {{ test_06_01.stdout }}

          ### TEST-06-02: MariaDB接続確認
          - **結果**: {{ 'PASS' if test_06_02.rc == 0 else 'FAIL' }}
          - **ステータス**: 接続成功

          ### TEST-06-03: データベース存在確認
          - **結果**: {{ 'PASS' if test_06_03.stdout_lines | length == 3 else 'FAIL' }}
