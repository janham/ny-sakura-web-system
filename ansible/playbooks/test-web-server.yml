          - **結果**: {{ 'PASS' if test_app_02.stdout_lines | length == 3 else 'FAIL' }}
          - **ディレクトリ数**: {{ test_app_02.stdout_lines | length }}
          - **出力**:
          {% for line in test_app_02.stdout_lines %}
