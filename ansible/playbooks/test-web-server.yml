          ### TEST-APP-03: storageディレクトリ権限確認
          - **結果**: {{ 'PASS' if 'drwxrwxr-x' in test_app_03.stdout and 'nginx' in test_app_03.stdout else 'FAIL' }}
          - **出力**: {{ test_app_03.stdout }}

          ### TEST-APP-04: publicディレクトリ確認
