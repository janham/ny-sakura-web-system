          - **結果**: {{ 'PASS' if test_02_01.rc == 0 else 'FAIL' }}
          - **出力**: {{ test_02_01.stderr }}

          ### TEST-02-02: Nginxサービス状態確認
          - **結果**: {{ 'PASS' if test_02_02.rc == 0 else 'FAIL' }}
