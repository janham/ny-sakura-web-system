---
# Webサーバー構築 Playbook
- name: Build Web Server
  hosts: web
  become: true
  gather_facts: true

  pre_tasks:
    - name: Display playbook start
      debug:
        msg: "Starting Web Server build for {{ inventory_hostname }}"

    - name: Display server information
      debug:
        msg:
          - "Hostname: {{ inventory_hostname }}"
          - "Public IP: {{ ansible_host }}"
          - "Private IP: {{ ansible_default_ipv4.address }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  roles:
    - role: common
      tags:
        - common
        - phase1

    - role: nginx
      tags:
        - nginx
        - phase2

    - role: php81
      tags:
        - php81
        - phase3

    - role: php74
      tags:
        - php74
        - phase4

    - role: mariadb_client
      tags:
        - mariadb_client
        - phase6

    - role: nfs
      tags:
        - nfs
        - phase6

    - role: ssl
      tags:
        - ssl
        - phase7

    - role: supervisor
      tags:
        - supervisor
        - phase8

    - role: rsync_to_batch
      tags:
        - rsync_to_batch
        - phase9

  post_tasks:
    - name: Display playbook completion
      debug:
        msg: "Web Server build completed successfully"
