---
# Add ACME challenge location to Nginx configs
- name: Add ACME challenge location to Nginx configurations
  hosts: web
  become: true

  vars:
    nginx_configs:
      - supplier2.conf
      - portal2.conf
      - portal2-new.conf

  tasks:
    - name: Add ACME challenge location block to each config
      blockinfile:
        path: "/etc/nginx/conf.d/{{ item }}"
        marker: "    # {mark} ANSIBLE MANAGED ACME CHALLENGE"
        insertafter: "server_name.*;"
        block: |2
              # Allow Let's Encrypt ACME challenges
              location ^~ /.well-known/acme-challenge/ {
                  alias /var/www/html/.well-known/acme-challenge/;
                  allow all;
                  default_type "text/plain";
              }
      loop: "{{ nginx_configs }}"

    - name: Test Nginx configuration
      command: nginx -t
      changed_when: false

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded
