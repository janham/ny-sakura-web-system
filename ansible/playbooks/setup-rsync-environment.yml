---
# rsync/scp 環境セットアップ Playbook
# 旧サーバーからのデータ移行準備
- name: Setup rsync and SSH environment for data migration
  hosts: web
  become: true

  tasks:
    - name: Install rsync package
      dnf:
        name: rsync
        state: present
      tags:
        - packages
        - rsync

    - name: Verify openssh-clients is installed
      dnf:
        name: openssh-clients
        state: present
      tags:
        - packages
        - ssh

    - name: Ensure .ssh directory exists with correct permissions
      file:
        path: /home/gsuser/.ssh
        state: directory
        owner: gsuser
        group: gsuser
        mode: '0700'
      tags:
        - ssh
        - permissions

    - name: Verify rsync installation
      command: rsync --version
      register: rsync_check
      changed_when: false
      failed_when: rsync_check.rc != 0
      tags:
        - verification
